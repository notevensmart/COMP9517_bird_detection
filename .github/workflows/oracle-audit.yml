name: Classical Detector Independent Oracle Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagnostic_oracles.py'
      - '.github/workflows/oracle-audit.yml'
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install traditional computer vision libraries and COCO
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pycocotools>=2.0.8,<3'
      - name: Run geometry / feature / COCO unit tests
        run: |
          python src/diagnostic_oracles.py --self-test
          python src/metrics_map.py
      - name: Download public Beach Bird dataset
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          candidates=[x.parent.parent for x in root.rglob('images/train') if (x.parent.parent/'labels/train').is_dir() and (x.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():candidates.append(root)
          candidates=list(dict.fromkeys(candidates))
          assert len(candidates)==1,candidates
          Path('dataset_root.txt').write_text(str(candidates[0]))
          PY
      - name: Run oracle proposal / box classifier / NMS / GT audit
        run: python -u src/diagnostic_oracles.py --dataset "$(cat dataset_root.txt)" --output diagnostic_results --train-limit 100 --val-limit 60
      - name: Save oracle diagnostics and visual overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classical-failure-oracle-audit
          path: diagnostic_results/
          retention-days: 14
          if-no-files-found: warn
