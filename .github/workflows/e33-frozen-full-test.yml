name: E33 Independent VAL Confirmation and Once-Only Full 240-Image TEST
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e33-frozen-full-test.yml'
  workflow_dispatch:
jobs:
  frozen-full-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install strictly classical CV/ML dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3' 'lightgbm>=4.0,<5'
      - name: Preflight and feature-contract tests (no TEST)
        run: |
          python src/e33_frozen_full_test.py --self-test
          python src/e32_failure_driven.py --self-test
          python src/e34_stage2_lgbm.py --self-test
          python src/e35_bounded_small_hybrid.py --self-test
          python src/metrics_map.py
      - name: Download Kaggle dataset without opening test images
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[x.parent.parent for x in p.rglob('images/train')
                 if x.is_dir() and (x.parent.parent/'labels/train').is_dir()
                 and (x.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          if len(roots)!=1:raise RuntimeError(f"Unexpected dataset roots: {roots}")
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Fit TRAIN200, confirm on complementary VAL231, freeze before TEST240
        run: |
          python -u src/e33_frozen_full_test.py --dataset "$(cat dataset_root.txt)" --output e33_full_evaluation --train-n 200 --candidate bounded_small_hybrid --confirm-n 0
      - name: Publish frozen decision, validation/test metrics, per-image data and real photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e33-frozen-full-240-test-results
          path: e33_full_evaluation/
          retention-days: 14
          if-no-files-found: warn
