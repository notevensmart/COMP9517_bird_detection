name: E44 Frozen E42 NMS Ablation and Failure Audit
on:
  push:
    branches:
      - research/e42-full-rbf-augmentation
    paths:
      - .github/workflows/e44-nms-ablation.yml
      - src/e44_nms_ablation.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
      BIRD_PROPOSAL_CACHE: .cache/bird-proposals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical CV dependencies
        run: pip install numpy scipy scikit-learn joblib pandas matplotlib pillow kagglehub 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Retrieve frozen E42 model checkpoint
        run: |
          mkdir -p e42_frozen
          gh run download 43974171244 --repo "${{ github.repository }}" --name e42-full-train-rbf-augmentation-results --dir e42_frozen
          test -s e42_frozen/trained_models.joblib
      - name: Restore proposal cache
        uses: actions/cache@v4
        with:
          path: .cache/bird-proposals
          key: bird-ss-e37-v1-${{ runner.os }}-e44-${{ github.run_id }}
          restore-keys: |
            bird-ss-e37-v1-${{ runner.os }}-
      - name: Download public TRAIN/VAL dataset, never TEST
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in root.rglob('images/train') if p.is_dir()
            and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():matches.append(root)
          matches=list(dict.fromkeys(matches))
          assert len(matches)==1,matches
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Compare NMS variants on full VAL with frozen checkpoint
        run: |
          python -u src/e44_nms_ablation.py --dataset "$(cat dataset_root.txt)" --checkpoint e42_frozen/trained_models.joblib --output e44_results
      - name: Upload NMS results and failure overlays even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e44-nms-ablation-and-failure-audit
          path: e44_results/
          if-no-files-found: warn
          retention-days: 14
