name: E43 End-to-End Smoke Validation
on:
  push:
    branches: ['research/e43-full-rbf-mixture']
    paths: ['.github/workflows/e43-smoke.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Feature-contract and metric tests
        run: |
          python src/e43_full_rbf_mixture.py --self-test
          python src/metrics_map.py
      - name: Download TRAIN VAL only
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in root.rglob('images/train') if p.is_dir()
            and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():matches.append(root)
          matches=list(dict.fromkeys(matches))
          assert len(matches)==1,matches
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Complete miniature TRAIN-to-mAP pipeline
        run: |
          python -u src/e43_full_rbf_mixture.py --dataset "$(cat dataset_root.txt)" --output e43_smoke --train-n 8 --val-n 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e43-smoke-output
          path: e43_smoke/
          retention-days: 14
          if-no-files-found: warn
