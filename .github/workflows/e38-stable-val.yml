name: E38 Stable-Proposal Classical Detector TRAIN/VAL Benchmark
on:
  push:
    branches: ['research/deterministic-selective-proposals']
    paths: ['.github/workflows/e38-stable-val.yml']
  workflow_dispatch:
jobs:
  stable-ss-versus-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install same classical dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Sanity and metric checks
        run: |
          python src/e35_bounded_small_hybrid.py --self-test
          python src/selective_search_detection.py --self-test
          python src/metrics_map.py
      - name: Download Kaggle data (TRAIN and VAL only)
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[x.parent.parent for x in p.rglob('images/train') if (x.parent.parent/'labels/train').is_dir() and (x.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Compare canonical Selective Search versus bounded small supplement on TRAIN45 VAL30
        run: python -u src/e35_bounded_small_hybrid.py --dataset "$(cat dataset_root.txt)" --output e38_results --train-n 45 --val-n 30
      - name: Archive full quantitative metrics and source-image overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e38-deterministic-proposal-val-results
          path: e38_results/
          retention-days: 14
          if-no-files-found: warn
