name: E26 Classical BBox Refinement and Soft-NMS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/bbox_refinement_study.py'
      - '.github/workflows/e26-bbox-refinement.yml'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical CV and COCO dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pycocotools>=2.0.8,<3'
      - name: Verify bbox transformations, Soft-NMS and official COCO
        run: |
          python src/bbox_refinement_study.py --self-test
          python src/metrics_map.py
      - name: Download dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[q.parent.parent for q in p.rglob('images/train') if (q.parent.parent/'labels/train').is_dir() and (q.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: E26 paired refiner and Soft-NMS ablation with visual validation
        run: |
          python -u src/bbox_refinement_study.py --dataset "$(cat dataset_root.txt)" --output e26_results --train-n 45 --val-n 30
      - name: Archive metrics and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e26-bbox-regression-softnms-visuals
          path: e26_results/
          if-no-files-found: warn
          retention-days: 14
