name: E31 Classical Classifier Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'src/classifier_benchmark.py'
      - '.github/workflows/e31-classifiers.yml'
  workflow_dispatch:
jobs:
  classical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical ML and evaluation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'lightgbm>=4.0,<5' 'pycocotools>=2.0.7,<3'
      - name: Check metrics and synthetic rank matching
        run: python src/classifier_benchmark.py --self-test
      - name: Download original Kaggle public data
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          source=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in source.rglob('images/train') if p.is_dir() and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if source.joinpath('images/train').is_dir():matches.append(source)
          matches=list(dict.fromkeys(matches))
          if len(matches)!=1:raise RuntimeError(f"Dataset roots unexpected: {matches}")
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Run paired 45-TRAIN 30-VAL classifier study
        run: python src/classifier_benchmark.py --dataset "$(cat dataset_root.txt)" --output e31_results --train-n 45 --val-n 30
      - name: Archive results (including partial progress on error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e31-classical-classifier-results
          path: |
            e31_results/
          retention-days: 14
          if-no-files-found: warn
