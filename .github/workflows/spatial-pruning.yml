name: Spatial Pruning Benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/spatial_pruning.py'
      - '.github/workflows/spatial-pruning.yml'
jobs:
  proposal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: |
          python src/spatial_pruning.py --self-test
          python src/detection_postprocess.py
      - name: Download public dataset and find root
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[x.parent.parent for x in p.rglob('images/train') if (x.parent.parent/'labels/train').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Measure recall and compute budget
        run: python src/spatial_pruning.py --dataset "$(cat dataset_root.txt)" --output spatial_results --val-limit 20
      - name: Train spatially pruned tiny detector with false-positive mining
        run: python src/spatial_detector_tiny.py --dataset "$(cat dataset_root.txt)" --output spatial_results --rounds 6
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-pruning-benchmark
          path: spatial_results/
          retention-days: 14
