name: E32 Failure-Driven Classical Detector Corrections
on:
  push:
    branches: [main]
    paths:
      - 'src/e32_failure_driven.py'
      - '.github/workflows/e32-failure-driven.yml'
  workflow_dispatch:
jobs:
  audit-and-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install strictly classical CV and COCO tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Geometry, matching and COCO unit tests
        run: |
          python src/e32_failure_driven.py --self-test
          python src/metrics_map.py
          python src/selective_search_detection.py --self-test
      - name: Download dataset (TRAIN and VAL experiments only)
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in root.rglob('images/train') if p.is_dir() and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():matches.append(root)
          matches=list(dict.fromkeys(matches))
          assert len(matches)==1,matches
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: E32 training, predeclared corrections, original-image comparison
        run: python -u src/e32_failure_driven.py --dataset "$(cat dataset_root.txt)" --output e32_results --train-n 100 --val-n 60
      - name: Upload measured results and actual annotated photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e32-failure-driven-classical-results
          path: e32_results/
          retention-days: 14
          if-no-files-found: warn
