name: Empty Annotation Visual Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/annotation_visual_audit.py'
      - '.github/workflows/annotation-visual-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Download public dataset
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[q.parent.parent for q in p.rglob('images/train') if (q.parent.parent/'labels/train').is_dir() and (q.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Produce every empty-label image contact sheet
        run: python -u src/annotation_visual_audit.py --dataset "$(cat dataset_root.txt)" --output label_review
      - name: Save visual dataset integrity sheets and annotation counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-annotation-visual-audit
          path: label_review/
          retention-days: 14
          if-no-files-found: warn
