name: E43 Full TRAIN RBF SVM Global vs Size-Expert Mixture
on:
  workflow_dispatch:
jobs:
  full-train-rbf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      BIRD_PROPOSAL_CACHE: .cache/bird-proposals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical ML dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Test proposal geometry and metric
        run: |
          python src/e43_full_rbf_mixture.py --self-test
          python src/selective_search_detection.py --self-test
          python src/metrics_map.py
      - name: Restore deterministic Selective Search proposal cache
        uses: actions/cache@v4
        with:
          path: .cache/bird-proposals
          key: bird-ss-e37-v1-${{ runner.os }}-e43-${{ github.run_id }}
          restore-keys: |
            bird-ss-e37-v1-${{ runner.os }}-e43-
      - name: Download public dataset without accessing TEST
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in root.rglob('images/train') if p.is_dir()
            and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():matches.append(root)
          matches=list(dict.fromkeys(matches))
          assert len(matches)==1,matches
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Smoke train 8 images and evaluate 2 real VAL images
        run: |
          python -u src/e43_full_rbf_mixture.py --dataset "$(cat dataset_root.txt)" --output smoke_results --train-n 8 --val-n 2
      - name: Full annotated-positive TRAIN and complete VAL; global vs size-specialist RBF mixtures
        run: |
          python -u src/e43_full_rbf_mixture.py --dataset "$(cat dataset_root.txt)" --output e43_results
      - name: Publish smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e43-diagnostics
          path: smoke_results/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish metrics, real-image overlays and mixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e43-full-train-rbf-mixture-results
          path: e43_results/
          retention-days: 14
          if-no-files-found: warn
