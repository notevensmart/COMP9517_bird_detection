name: Bird Detection Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/bird-audit.yml'
jobs:
  quick-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python src/cloud_audit.py --self-test
      - name: Download public Beach Bird dataset
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          source=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          print('Downloaded:',source)
          matches=[p.parent.parent for p in source.rglob('images/train') if p.is_dir() and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if source.joinpath('images/train').is_dir():matches.append(source)
          matches=list(dict.fromkeys(matches))
          print('Dataset roots:',matches)
          if len(matches)!=1:raise RuntimeError('Dataset layout unexpected; inspect download directory')
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Run reproducible quick audit
        run: python src/cloud_audit.py --dataset "$(cat dataset_root.txt)" --output artifacts --train-limit 80 --val-limit 20
      - name: Tiny-set overfitting gate
        run: python src/tiny_overfit.py --dataset "$(cat dataset_root.txt)" --output artifacts
      - name: Upload diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-quick-audit-results
          path: |
            artifacts/
            dataset_root.txt
          if-no-files-found: warn
          retention-days: 14
