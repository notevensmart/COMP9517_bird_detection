name: E40 Full Classical Three-Expert Bird Detector
on:
  push:
    branches: ['research/e40-three-expert-detector']
    paths:
      - 'src/e40_three_expert_detector.py'
      - '.github/workflows/e40-three-expert.yml'
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install strictly classical dependencies and official COCO evaluator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3' 'lightgbm>=4.0,<5'
      - name: Check preprocessing, calibration geometry, Soft NMS and official metrics
        run: |
          python src/e40_three_expert_detector.py --self-test
          python src/e39_scale_aware_boosting.py --self-test
          python src/metrics_map.py
      - name: Download Kaggle dataset; do not inspect TEST
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[x.parent.parent for x in p.rglob('images/train') if x.is_dir()
                   and (x.parent.parent/'labels/train').is_dir()
                   and (x.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():matches.append(p)
          matches=list(dict.fromkeys(matches))
          if len(matches)!=1:raise RuntimeError(f"Invalid dataset paths: {matches}")
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Three experts with TRAIN-only calibration and learned box refinement
        run: |
          python -u src/e40_three_expert_detector.py --dataset "$(cat dataset_root.txt)" --output e40_results --train-n 60 --cal-n 15 --val-n 30
      - name: Preserve actual prediction overlays and per-stage mAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e40-classical-three-expert-outputs
          path: e40_results/
          retention-days: 14
          if-no-files-found: warn
