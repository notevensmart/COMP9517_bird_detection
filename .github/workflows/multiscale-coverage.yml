name: Bird Scale Coverage Correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/multiscale_coverage.py'
      - '.github/workflows/multiscale-coverage.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic proposal unit tests
        run: python src/multiscale_coverage.py --self-test
      - name: Download public bird dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          match=[q.parent.parent for q in root.rglob('images/train') if (q.parent.parent/'labels/train').is_dir() and (q.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():match.append(root)
          match=list(dict.fromkeys(match))
          assert len(match)==1,match
          Path('dataset_root.txt').write_text(str(match[0]))
          PY
      - name: Size-stratified GT-free candidate recall on same validation images
        run: python -u src/multiscale_coverage.py --dataset "$(cat dataset_root.txt)" --output scale_results --val-limit 30 --per-shape 50
      - name: Archive data and bird-size visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-multiscale-recall
          path: scale_results/
          retention-days: 14
          if-no-files-found: warn
