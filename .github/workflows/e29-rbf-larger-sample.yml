name: E29 Larger-Sample RBF Classical Bird Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e29-rbf-larger-sample.yml'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pycocotools>=2.0.8,<3'
      - name: Verify geometry and classical ML
        run: |
          python src/nonlinear_appearance_study.py --self-test
          python src/metrics_map.py
      - name: Download original bird dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[q.parent.parent for q in p.rglob('images/train') if (q.parent.parent/'labels/train').is_dir() and (q.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: E29 100-TRAIN 60-VAL classical nonlinear model scaling
        run: |
          python -u src/nonlinear_appearance_study.py --dataset "$(cat dataset_root.txt)" --output e29_results --train-n 100 --val-n 60
      - name: Archive mAP, TP FP and real visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e29-nonlinear-hog-lbp-100train-60val
          path: e29_results/
          if-no-files-found: warn
          retention-days: 14
