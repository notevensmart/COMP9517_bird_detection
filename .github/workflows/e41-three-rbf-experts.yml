name: E41 Three Classical RBF Bird Experts (TRAIN VAL only)
on:
  push:
    branches: ['research/e41-three-rbf-experts']
    paths: ['src/e41_three_rbf_experts.py','.github/workflows/e41-three-rbf-experts.yml']
  workflow_dispatch:
jobs:
  compare-experts:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical computer vision dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3'
      - name: Preflight expert routing, aspect QA and COCO metric tests
        run: |
          python src/e41_three_rbf_experts.py --self-test
          python src/selective_search_detection.py --self-test
          python src/metrics_map.py
      - name: Download dataset without reading TEST
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          matches=[p.parent.parent for p in root.rglob('images/train')
                   if p.is_dir() and (p.parent.parent/'labels/train').is_dir()
                   and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():matches.append(root)
          matches=list(dict.fromkeys(matches))
          assert len(matches)==1,matches
          Path('dataset_root.txt').write_text(str(matches[0]))
          PY
      - name: Fit TRAIN100 and evaluate fixed VAL60 with real-image overlays
        run: |
          python -u src/e41_three_rbf_experts.py --dataset "$(cat dataset_root.txt)" --output e41_results --train-n 100 --val-n 60
      - name: Upload metrics, per-image data, original-resolution predictions and crop audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e41-three-rbf-experts-100train-60val
          path: e41_results/
          retention-days: 14
          if-no-files-found: warn
