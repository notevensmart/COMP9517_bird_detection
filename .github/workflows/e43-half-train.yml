name: E43 Half-TRAIN DPM Fisher ACF
on:
  push:
    branches: [research/e43-half-train-classical]
    paths:
      - 'src/e43_half_train.py'
      - '.github/workflows/e43-half-train.yml'
  workflow_dispatch:
jobs:
  half-train:
    strategy:
      fail-fast: false
      matrix:
        method: [dpm, fisher, acf]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical ML, SIFT, and COCO evaluation requirements
        run: |
          python -m pip install -r requirements.txt 'pycocotools>=2.0.7,<3'
          python -m pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless
          python -m pip install 'opencv-contrib-python-headless>=4.8,<5'
      - name: Verify paper-feature and sample-selection mathematics
        run: python -u src/e43_half_train.py --method "${{ matrix.method }}" --self-test
      - name: Download public Beach Bird dataset
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          source=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[p.parent.parent for p in source.rglob('images/train') if p.is_dir() and (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if source.joinpath('images/train').is_dir():roots.append(source)
          roots=list(dict.fromkeys(roots))
          if len(roots)!=1:raise RuntimeError(f'Unexpected dataset roots: {roots}')
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Train on 685 TRAIN, evaluate only 120 VAL
        run: |
          python -u src/e43_half_train.py --method "${{ matrix.method }}" --dataset "$(cat dataset_root.txt)" --output "e43_${{ matrix.method }}" --train-n 685 --val-n 120 --cap 1200
      - name: Archive model, metrics, logs, and real prediction overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e43-half-train-${{ matrix.method }}
          path: e43_${{ matrix.method }}/
          retention-days: 14
          compression-level: 5
          if-no-files-found: warn
