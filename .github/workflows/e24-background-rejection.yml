name: E24 Focused Background Rejection Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/background_rejector.py'
      - '.github/workflows/e24-background-rejection.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical and COCO evaluation libraries
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pycocotools>=2.0.8,<3'
      - name: Check image-only features and mAP
        run: |
          python src/background_rejector.py --self-test
          python src/metrics_map.py
      - name: Download public bird dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          c=[x.parent.parent for x in root.rglob('images/train') if (x.parent.parent/'labels/train').is_dir() and (x.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():c.append(root)
          c=list(dict.fromkeys(c))
          assert len(c)==1,c
          Path('dataset_root.txt').write_text(str(c[0]))
          PY
      - name: Fit small background rejector, compare mAP and top20 annotated boxes
        run: python -u src/background_rejector.py --dataset "$(cat dataset_root.txt)" --output e24_results --train-n 45 --val-n 12
      - name: Save all variant metrics and visual quality gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e24-background-rejection-diagnostics
          path: e24_results/
          if-no-files-found: warn
          retention-days: 14
