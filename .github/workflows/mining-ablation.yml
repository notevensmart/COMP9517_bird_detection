name: Classical Hard Example Mining Ablation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/mining_ablation.py'
      - '.github/workflows/mining-ablation.yml'
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install classical vision dependencies and official COCO evaluator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pycocotools>=2.0.8,<3'
      - name: Unit tests for sampling and mAP
        run: |
          python src/mining_ablation.py --self-test
          python src/metrics_map.py
      - name: Download public bird dataset
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          valid=[p.parent.parent for p in root.rglob('images/train') if (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():valid.append(root)
          valid=list(dict.fromkeys(valid))
          assert len(valid)==1,valid
          Path('dataset_root.txt').write_text(str(valid[0]))
          PY
      - name: Compare 4 mining configurations with official validation mAP50
        run: python src/mining_ablation.py --dataset "$(cat dataset_root.txt)" --output mining_results --train-limit 35 --val-limit 12 --rounds 3
      - name: Save all paper metrics including unsuccessful rounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mining-ablation
          path: mining_results/
          retention-days: 14
          if-no-files-found: warn
