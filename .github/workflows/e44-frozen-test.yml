name: E44 Saved E43 Models Official TEST (post-development)
on:
  push:
    branches: [research/e44-saved-weights-test]
    paths:
      - 'src/e44_frozen_test.py'
      - '.github/workflows/e44-frozen-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-test:
    strategy:
      fail-fast: false
      matrix:
        method: [dpm, fisher, acf]
        include:
          - method: dpm
            artifact: e43-half-train-dpm
          - method: fisher
            artifact: e43-half-train-fisher
          - method: acf
            artifact: e43-half-train-acf
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing model environment and COCO scorer
        run: |
          python -m pip install -r requirements.txt 'pycocotools>=2.0.7,<3'
          python -m pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless
          python -m pip install 'opencv-contrib-python-headless>=4.8,<5'
      - name: Load frozen E43 trained model from completed run 44496786139
        uses: actions/download-artifact@v4
        with:
          run-id: 44496786139
          name: ${{ matrix.artifact }}
          path: e43_frozen
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm exact model file exists and expected bytes
        run: |
          test -s "e43_frozen/model_${{ matrix.method }}.joblib"
          sha256sum "e43_frozen/model_${{ matrix.method }}.joblib"
      - name: Self-test geometry and official COCO AP metric
        run: python -u src/e44_frozen_test.py --method "${{ matrix.method }}" --self-test
      - name: Download Beach Bird data with official TEST labels
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          source=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[p.parent.parent for p in source.rglob('images/test') if p.is_dir() and (p.parent.parent/'labels/test').is_dir()]
          if source.joinpath('images/test').is_dir():roots.append(source)
          roots=list(dict.fromkeys(roots))
          if len(roots)!=1:raise RuntimeError(f"Unexpected dataset roots: {roots}")
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Run frozen model on all 240 official TEST images
        run: |
          python -u src/e44_frozen_test.py --method "${{ matrix.method }}" --dataset "$(cat dataset_root.txt)" --weights "e43_frozen/model_${{ matrix.method }}.joblib" --output "e44_${{ matrix.method }}"
      - name: Archive full-TEST inference, metrics, per-image CSV, actual overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e44-frozen-test-${{ matrix.method }}
          path: e44_${{ matrix.method }}/
          retention-days: 14
          if-no-files-found: warn
