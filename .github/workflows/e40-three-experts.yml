name: E40 Three-Expert Classical Detector Validation
on:
  push:
    branches: ['research/e40-three-expert-refinement']
    paths: ['.github/workflows/e40-three-experts.yml','src/e40_three_expert_detector.py']
  workflow_dispatch:
jobs:
  e40:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install strictly classical dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'pycocotools>=2.0.8,<3' 'lightgbm>=4.0,<5'
      - name: Static syntax and geometry unit tests
        run: |
          python -m py_compile src/e40_three_expert_detector.py
          python src/e40_three_expert_detector.py --self-test
          python src/metrics_map.py
      - name: Obtain public TRAIN and VAL only
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          p=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[x.parent.parent for x in p.rglob('images/train')
                 if x.is_dir() and (x.parent.parent/'labels/train').is_dir()
                 and (x.parent.parent/'images/val').is_dir()]
          if (p/'images/train').is_dir():roots.append(p)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Paired E40 benchmark 100 TRAIN 60 VAL, with original prediction photos
        run: |
          python -u src/e40_three_expert_detector.py --dataset "$(cat dataset_root.txt)" --output e40_results --train-n 100 --val-n 60
      - name: Publish metrics, calibration, image audits and preprocessed crop examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e40-three-expert-calibration-refinement-results
          path: e40_results/
          retention-days: 14
          if-no-files-found: warn
