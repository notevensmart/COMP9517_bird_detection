name: E22 Negative-Only Training Image Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/negative_image_audit.py'
      - '.github/workflows/e22-negative-image-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify negative-label guardrails
        run: python src/negative_image_audit.py --self-test
      - name: Download public bird dataset
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          root=Path(kagglehub.dataset_download('liugalhigh/beach-bird'))
          roots=[p.parent.parent for p in root.rglob('images/train') if (p.parent.parent/'labels/train').is_dir() and (p.parent.parent/'images/val').is_dir()]
          if (root/'images/train').is_dir():roots.append(root)
          roots=list(dict.fromkeys(roots))
          assert len(roots)==1,roots
          Path('dataset_root.txt').write_text(str(roots[0]))
          PY
      - name: Audit exact training negative-only images with contact sheets
        run: python -u src/negative_image_audit.py --dataset "$(cat dataset_root.txt)" --train-limit 100 --output negative_audit
      - name: Archive label provenance and original photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e22-negative-image-qa
          path: negative_audit/
          retention-days: 14
          if-no-files-found: warn
